name: Smart Docan BMS
slug: smart_docan_bms
version: "0.1.2-dev"
description: Lecture Bluetooth des BMS Daren / Docan Power NOON (MQTT et tableau de bord)
url: https://github.com/tapion69/smart-docan-bms
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
host_dbus: true
services:
  - mqtt:want
ingress: true
ingress_port: 1895
panel_icon: mdi:battery-bluetooth
options:
  auto_discover: true
  addresses: ""
  names: ""
  scan_seconds: 8
  poll_seconds: 30
  rescan_seconds: 180
  dashboard_refresh_seconds: 20
  mqtt_mode: auto
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_tls: false
  log_level: info
schema:
  auto_discover: bool
  addresses: str?
  names: str?
  scan_seconds: int(4,20)
  poll_seconds: int(10,300)
  rescan_seconds: int(60,3600)
  dashboard_refresh_seconds: int(5,120)
  mqtt_mode: list(auto|manual)
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
  mqtt_tls: bool
  log_level: list(info|debug|warning)
