name: Smart Docan BMS
slug: smart_docan_bms
version: "0.1.18-dev"
description: Lecture Bluetooth ou Serial RS485 des BMS Daren / Docan Power NOON vers MQTT
url: https://github.com/tapion69/smart-docan-bms
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
host_dbus: true
uart: true
services:
  - mqtt:want
panel_icon: mdi:battery-bluetooth
options:
  transport: bluetooth
  serial_passive: false
  serial_port: ""
  serial_baudrate: 9600
  serial_addresses: ""
  serial_slot_1_address: ""
  serial_slot_2_address: ""
  serial_slot_3_address: ""
  serial_slot_4_address: ""
  auto_discover: true
  strict_slots: false
  migrate_legacy_entities: true
  slot_1_enabled: true
  slot_1_address: ""
  slot_1_name: "Batterie 1"
  slot_2_enabled: true
  slot_2_address: ""
  slot_2_name: "Batterie 2"
  slot_3_enabled: true
  slot_3_address: ""
  slot_3_name: "Batterie 3"
  slot_4_enabled: true
  slot_4_address: ""
  slot_4_name: "Batterie 4"
  addresses: ""
  names: ""
  scan_seconds: 8
  poll_seconds: 30
  rescan_seconds: 180
  missing_rescan_seconds: 30
  recover_stale_connections: false
  stale_connection_after_seconds: 180
  mqtt_mode: auto
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_tls: false
  log_level: info
schema:
  transport: list(bluetooth|serial|dual)
  serial_passive: bool
  serial_port: str?
  serial_baudrate: int(9600,19200)
  serial_addresses: str?
  serial_slot_1_address: str?
  serial_slot_2_address: str?
  serial_slot_3_address: str?
  serial_slot_4_address: str?
  auto_discover: bool
  strict_slots: bool
  migrate_legacy_entities: bool
  slot_1_enabled: bool
  slot_1_address: str?
  slot_1_name: str
  slot_2_enabled: bool
  slot_2_address: str?
  slot_2_name: str
  slot_3_enabled: bool
  slot_3_address: str?
  slot_3_name: str
  slot_4_enabled: bool
  slot_4_address: str?
  slot_4_name: str
  addresses: str?
  names: str?
  scan_seconds: int(4,20)
  poll_seconds: int(5,300)
  rescan_seconds: int(60,3600)
  missing_rescan_seconds: int(15,180)
  recover_stale_connections: bool
  stale_connection_after_seconds: int(60,1800)
  mqtt_mode: list(auto|manual)
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
  mqtt_tls: bool
  log_level: list(info|debug|warning)
