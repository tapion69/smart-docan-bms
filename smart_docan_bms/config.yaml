name: Smart Docan BMS
slug: smart_docan_bms
version: "0.1.3-dev"
description: Lecture Bluetooth des BMS Daren / Docan Power NOON (MQTT et tableau de bord)
url: https://github.com/tapion69/smart-docan-bms
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
host_dbus: true
services:
  - mqtt:want
ingress: true
ingress_port: 1895
panel_icon: mdi:battery-bluetooth
options:
  auto_discover: true
  strict_slots: false
  migrate_legacy_entities: true
  slot_1_address: ""
  slot_1_name: "Batterie 1"
  slot_2_address: ""
  slot_2_name: "Batterie 2"
  slot_3_address: ""
  slot_3_name: "Batterie 3"
  slot_4_address: ""
  slot_4_name: "Batterie 4"
  addresses: ""
  names: ""
  scan_seconds: 8
  poll_seconds: 30
  rescan_seconds: 180
  dashboard_refresh_seconds: 20
  mqtt_mode: auto
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_tls: false
  log_level: info
schema:
  auto_discover: bool
  strict_slots: bool
  migrate_legacy_entities: bool
  slot_1_address: str?
  slot_1_name: str
  slot_2_address: str?
  slot_2_name: str
  slot_3_address: str?
  slot_3_name: str
  slot_4_address: str?
  slot_4_name: str
  addresses: str?
  names: str?
  scan_seconds: int(4,20)
  poll_seconds: int(10,300)
  rescan_seconds: int(60,3600)
  dashboard_refresh_seconds: int(5,120)
  mqtt_mode: list(auto|manual)
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
  mqtt_tls: bool
  log_level: list(info|debug|warning)
