configuration:
  serial_passive:
    name: Serial — écoute passive sans polling
    description: Activé = écoute le bus du BMS Master, sans envoyer aucune requête RS485 ; désactivé = interrogation active comme auparavant. La Master doit émettre des trames lisibles pour que ses mesures remontent.
  transport:
    name: Mode de communication
    description: bluetooth = fonctionnement habituel ; serial = lecture filaire RS485 Daren (pilote expérimental)
  serial_port:
    name: Serial - chemin du port (à renseigner)
    description: Vide par défaut ; saisir soi-même /dev/serial/by-id/... du convertisseur USB-RS485
  serial_baudrate:
    name: Serial - vitesse (bauds)
    description: 9600 par défaut pour les batteries Docan vérifiées ; 19200 possible selon BMS
  serial_addresses:
    name: Serial - adresses BMS à interroger (facultatif)
    description: Vide = essayer la Master (adresse 0), puis les adresses 1 à 4 ; sinon saisir par exemple 0,1,2,3 (adresses 0 à 15)
  serial_slot_1_address:
    name: Batterie 1 - adresse RS485 (facultatif)
    description: Vide = attribution automatique ; si renseignée, ce BMS conserve le numéro Batterie 1
  serial_slot_2_address:
    name: Batterie 2 - adresse RS485 (facultatif)
  serial_slot_3_address:
    name: Batterie 3 - adresse RS485 (facultatif)
  serial_slot_4_address:
    name: Batterie 4 - adresse RS485 (facultatif)
  strict_slots:
    name: Emplacements stricts
    description: Seules les batteries déjà associées aux emplacements sont lues, sans attribution automatique de nouveaux appareils
  migrate_legacy_entities:
    name: Nettoyer les anciens capteurs MQTT
    description: Supprimer du broker les découvertes retenues basées sur les adresses MAC après création des nouvelles entités fixes
  slot_1_enabled:
    name: Activer la batterie 1
    description: Désactiver si cet emplacement n'est pas utilisé ; l'association reste sauvegardée, mais le parc et les totaux l'ignorent
  slot_1_address:
    name: Batterie 1 - adresse Bluetooth (facultatif)
    description: Laisser vide pour la première attribution automatique, puis association sauvegardée durablement
  slot_1_name:
    name: Batterie 1 - nom
  slot_2_enabled:
    name: Activer la batterie 2
    description: Désactiver pour exclure cet emplacement du parc et du total sans perdre l'association
  slot_2_address:
    name: Batterie 2 - adresse Bluetooth (facultatif)
  slot_2_name:
    name: Batterie 2 - nom
  slot_3_enabled:
    name: Activer la batterie 3
    description: Désactiver pour exclure cet emplacement du parc et du total sans perdre l'association
  slot_3_address:
    name: Batterie 3 - adresse Bluetooth (facultatif)
  slot_3_name:
    name: Batterie 3 - nom
  slot_4_enabled:
    name: Activer la batterie 4
    description: Désactiver pour une installation à trois batteries déjà associées à quatre emplacements
  slot_4_address:
    name: Batterie 4 - adresse Bluetooth (facultatif)
  slot_4_name:
    name: Batterie 4 - nom
  auto_discover:
    name: Découverte automatique Bluetooth
    description: Rechercher automatiquement tous les BMS DWF détectés
  addresses:
    name: Adresses Bluetooth (facultatif)
    description: Limiter aux adresses saisies, séparées par une virgule
  names:
    name: Noms personnalisés (facultatif)
    description: AA:BB:CC:DD:EE:FF=Batterie 1;11:22:33:44:55:66=Batterie 2
  scan_seconds:
    name: Durée de recherche Bluetooth (secondes)
  poll_seconds:
    name: Intervalle cible entre débuts des lectures BMS (secondes)
    description: Chaque cycle lit toutes les batteries et publie les valeurs; si les 4 BMS prennent plus longtemps, la cadence sera limitée par le Bluetooth
  rescan_seconds:
    name: Fréquence de recherche des appareils (secondes)
  missing_rescan_seconds:
    name: Nouvelle recherche si batterie manquante (secondes)
    description: Recherche plus fréquente uniquement lorsqu'une batterie affectée à un emplacement n'est pas vue au scan (30 s conseillé)
  recover_stale_connections:
    name: Récupération ciblée des connexions Bluetooth bloquées
    description: Désactivé par défaut. Après plusieurs recherches sans résultat, autoriser la déconnexion de la batterie absente uniquement (peut interrompre une autre application connectée à ce BMS)
  stale_connection_after_seconds:
    name: Délai avant récupération Bluetooth ciblée (secondes)
    description: Attendre au moins ce délai sans annonce ni lecture, avec 2 scans manqués minimum. Une tentative maximum par batterie et par heure
  mqtt_mode:
    name: Mode MQTT
    description: auto = identifiants du Supervisor; manual = paramètres saisis ci-dessous
  mqtt_host:
    name: Serveur MQTT (mode manuel)
    description: Par exemple core-mosquitto ou l’adresse IP du broker
  mqtt_port:
    name: Port MQTT (mode manuel)
  mqtt_username:
    name: Identifiant MQTT (mode manuel)
    description: Un utilisateur autorisé à se connecter au broker
  mqtt_password:
    name: Mot de passe MQTT (mode manuel)
  mqtt_tls:
    name: Connexion MQTT sécurisée TLS (mode manuel)
    description: Laisser désactivé pour le port 1883 de Mosquitto
  log_level:
    name: Niveau de journalisation
