configuration:
  strict_slots:
    name: Strict battery slots
    description: Do not automatically assign newly discovered Bluetooth devices to an unused slot
  migrate_legacy_entities:
    name: Migrate old MAC-based MQTT entities
    description: Remove retained legacy MQTT discovery configs after the new fixed IDs are published
  slot_1_address:
    name: Battery 1 - Bluetooth address (optional)
  slot_1_name:
    name: Battery 1 - name
  slot_2_address:
    name: Battery 2 - Bluetooth address (optional)
  slot_2_name:
    name: Battery 2 - name
  slot_3_address:
    name: Battery 3 - Bluetooth address (optional)
  slot_3_name:
    name: Battery 3 - name
  slot_4_address:
    name: Battery 4 - Bluetooth address (optional)
  slot_4_name:
    name: Battery 4 - name
  auto_discover:
    name: Auto-discover Bluetooth BMS
  addresses:
    name: Bluetooth addresses (optional)
  names:
    name: Custom BMS names (optional)
  scan_seconds:
    name: Bluetooth scanning duration (seconds)
  poll_seconds:
    name: Target time between BMS polling cycle starts (seconds)
    description: Each cycle reads all batteries and publishes measurements; BLE duration can limit throughput
  rescan_seconds:
    name: Device rescan interval (seconds)
  dashboard_refresh_seconds:
    name: Dashboard refresh interval (seconds)
    description: Web page refresh only, independent of BMS polling
  mqtt_mode:
    name: MQTT connection mode
    description: auto = Supervisor credentials; manual = credentials entered below
  mqtt_host:
    name: MQTT broker host (manual mode)
  mqtt_port:
    name: MQTT broker port (manual mode)
  mqtt_username:
    name: MQTT username (manual mode)
  mqtt_password:
    name: MQTT password (manual mode)
  mqtt_tls:
    name: Enable MQTT TLS (manual mode)
  log_level:
    name: Logging level
