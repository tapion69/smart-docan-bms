configuration:
  transport:
    name: Communication transport
    description: bluetooth = wireless reads; serial = read-only polling on the dedicated Master RS485 port (not RS485A/B).
  serial_port:
    name: Serial device path (user supplied)
    description: Empty by default; enter the USB-RS485 device's own /dev/serial/by-id/... path
  serial_baudrate:
    name: Serial baud rate
    description: 9600 default for confirmed Docan batteries; 19200 for other Daren BMS
  serial_addresses:
    name: Serial BMS bus addresses (optional)
    description: Blank auto-discovers 0 to 4 and sorts by physical address; optional list limits scanning
  strict_slots:
    name: Strict battery slots
    description: Do not automatically assign newly discovered Bluetooth devices to an unused slot
  migrate_legacy_entities:
    name: Migrate old MAC-based MQTT entities
    description: Remove retained legacy MQTT discovery configs after the new fixed IDs are published
  slot_1_enabled:
    name: Enable battery 1
    description: Disabling excludes this slot from fleet counts while preserving the saved address
  slot_1_address:
    name: Battery 1 - Bluetooth address (optional)
  slot_1_name:
    name: Battery 1 - name
  slot_2_enabled:
    name: Enable battery 2
  slot_2_address:
    name: Battery 2 - Bluetooth address (optional)
  slot_2_name:
    name: Battery 2 - name
  slot_3_enabled:
    name: Enable battery 3
  slot_3_address:
    name: Battery 3 - Bluetooth address (optional)
  slot_3_name:
    name: Battery 3 - name
  slot_4_enabled:
    name: Enable battery 4
    description: Disable for a three-pack installation that formerly used four slots
  slot_4_address:
    name: Battery 4 - Bluetooth address (optional)
  slot_4_name:
    name: Battery 4 - name
  auto_discover:
    name: Auto-discover Bluetooth BMS
  addresses:
    name: Bluetooth addresses (optional)
  names:
    name: Custom BMS names (optional)
  scan_seconds:
    name: Bluetooth scanning duration (seconds)
  poll_seconds:
    name: Target time between BMS polling cycle starts (seconds)
    description: Each cycle reads all batteries; actual rate depends on communication duration. Minimum 5 seconds.
  rescan_seconds:
    name: Device rescan interval (seconds)
  missing_rescan_seconds:
    name: Rescan interval while an assigned BMS is missing (seconds)
    description: Scan more often only when one of the saved battery slots has not been detected
  recover_stale_connections:
    name: Recover stuck Bluetooth connections per battery
    description: Off by default. Disconnect only the missing BMS after several failed scans; may interrupt another active client for that BMS
  stale_connection_after_seconds:
    name: Targeted Bluetooth recovery delay (seconds)
    description: Minimum gap without advertisements or successful reads and at least 2 missed scans; at most once per battery per hour
  mqtt_mode:
    name: MQTT connection mode
    description: auto = Supervisor credentials; manual = credentials entered below
  mqtt_host:
    name: MQTT broker host (manual mode)
  mqtt_port:
    name: MQTT broker port (manual mode)
  mqtt_username:
    name: MQTT username (manual mode)
  mqtt_password:
    name: MQTT password (manual mode)
  mqtt_tls:
    name: Enable MQTT TLS (manual mode)
  log_level:
    name: Logging level
